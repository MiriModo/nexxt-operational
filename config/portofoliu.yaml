# Profilul statistic al portofoliului realist (generate --profil realist, pentru clienții de după cele 50 de scenarii etalon).
# Fiecare client se construiește trăgând la sorți din aceste distribuții; schimbi un procent → se schimbă portofoliul,
# fără cod. Ponderile însumează 1; probabilitățile sunt în [0, 1]. Valorile sunt sintetice, ordin de mărime plauzibil.

tipologii:                     # SL = salariat cu salariul la noi · SE = salariat cu salariul la altă bancă
  SL: 0.42
  SE: 0.18
  IND: 0.14
  PEN: 0.12
  ANT: 0.06
  DIA: 0.05
  TAN: 0.03

niveluri:                      # ponderi de bază; vechimea mută clientul în sus (vezi niveluri_bonus_vechime)
  standard: 0.70
  gold: 0.24
  platinum: 0.06
niveluri_bonus_vechime: 0.03   # +3 pp la gold/platinum pentru fiecare an de vechime peste 5

vechime_client_ani: { min: 0.3, mod: 5.0, max: 15.0 }     # triunghiular (TAN: min 0.3, max 1.5)
produse_atasate: { min: 1, max: 4 }                          # pe lângă cont_salariu (SL/TAN îl au mereu)

credite:
  nr_credite:                  # ponderi pentru 0 / 1 / 2 / 3 credite, pe tipologie
    SL:  [0.02, 0.55, 0.33, 0.10]
    SE:  [0.03, 0.57, 0.32, 0.08]
    IND: [0.05, 0.60, 0.30, 0.05]
    PEN: [0.05, 0.70, 0.22, 0.03]
    ANT: [0.05, 0.50, 0.35, 0.10]
    DIA: [0.05, 0.70, 0.22, 0.03]
    TAN: [0.40, 0.55, 0.05, 0.00]
  produse:                     # ponderi pe produs, pe tipologie (primul credit; al doilea nu repetă produsul garantat)
    SL:  { ipotecar: 0.42, imobiliar: 0.08, nevoi_personale: 0.22, card_credit: 0.22, refinantare: 0.06 }
    SE:  { ipotecar: 0.40, imobiliar: 0.08, nevoi_personale: 0.22, card_credit: 0.24, refinantare: 0.06 }
    IND: { ipotecar: 0.30, imobiliar: 0.10, nevoi_personale: 0.30, card_credit: 0.25, refinantare: 0.05 }
    PEN: { ipotecar: 0.10, imobiliar: 0.25, nevoi_personale: 0.35, card_credit: 0.28, refinantare: 0.02 }
    ANT: { ipotecar: 0.35, imobiliar: 0.15, nevoi_personale: 0.20, card_credit: 0.25, refinantare: 0.05 }
    DIA: { ipotecar: 0.45, imobiliar: 0.10, nevoi_personale: 0.25, card_credit: 0.15, refinantare: 0.05 }
    TAN: { ipotecar: 0.05, imobiliar: 0.00, nevoi_personale: 0.55, card_credit: 0.40, refinantare: 0.00 }
  parametri:                   # distribuții triunghiulare (min, mod, max); card_credit se generează din limită, ca azi
    ipotecar:        { sold: [80000, 250000, 900000], ani_ramasi: [5, 18, 28], ani_vechime: [1, 4, 12], marja: [2.0, 2.5, 3.2], fixa_prob: 0.55 }
    imobiliar:       { sold: [60000, 180000, 600000], ani_ramasi: [4, 14, 25], ani_vechime: [1, 5, 12], marja: [2.1, 2.6, 3.4], fixa_prob: 0.50 }
    nevoi_personale: { sold: [5000, 30000, 90000],    ani_ramasi: [1, 3, 6],   ani_vechime: [0.5, 2, 4], marja: [3.8, 5.0, 6.5], fixa_prob: 1.0 }
    refinantare:     { sold: [30000, 80000, 160000],  ani_ramasi: [2, 4, 7],   ani_vechime: [0.5, 2, 5], marja: [3.5, 4.5, 6.0], fixa_prob: 1.0 }

# Probabilitatea de bază a fiecărui semnal plantabil. Cele „per credit" se trag pentru fiecare credit potrivit,
# cele „per client" o dată. `expirare_dobanda_fixa` se aplică doar creditelor cu dobândă fixă garantate.
semnale:
  per_credit:
    expirare_dobanda_fixa: { prob: 0.12, zile: [1, 120] }        # uniform pe interval
    intarziere_noua: { prob: 0.045, prob_grav: 0.30, zile: [3, 25], zile_grav: [32, 60] }
    card_stres: { prob: 0.06 }
    ltv_depasit: { prob: 0.02 }
    asigurare_expirata: { prob: 0.03 }
    restructurare_anterioara: { prob: 0.03 }
  per_client:
    rata_alt_creditor: { prob: 0.10, prob_nou: 0.45 }            # nou = 3 luni, vechi = 8 luni
    salariu_mutat: { prob: 0.05, prob_alta_banca: 0.55 }         # alta_banca = ratele se plătesc prin transfer propriu
    cont_nefolosit: { prob: 0.40 }                               # doar dacă salariu_mutat = alta_banca
    venit_scadere: { prob: 0.05, factor: [0.5, 0.75] }
    angajator_in_dificultate: { prob: 0.02 }                     # se realizează prin angajatorul tras din bazin
    ci_expirata: { prob: 0.035 }
    consimtamant_lipsa: { prob: 0.02 }
    kyc_vechi: { prob: 0.03 }
    flag_blocant: { prob: 0.004 }
    poprire_activa: { prob: 0.015 }

# Corelații: multiplicator aplicat probabilității semnalului „efect" dacă „cauza" a fost deja trasă.
corelatii:
  - { cauza: intarziere_noua, efect: venit_scadere, factor: 3.0 }
  - { cauza: intarziere_noua, efect: card_stres, factor: 2.0 }
  - { cauza: card_stres, efect: rata_alt_creditor, factor: 2.0 }
  - { cauza: venit_scadere, efect: intarziere_noua, factor: 2.0 }
  - { cauza: poprire_activa, efect: intarziere_noua, factor: 3.0 }
  - { cauza: expirare_dobanda_fixa, efect: rata_alt_creditor, factor: 1.5 }
  - { cauza: salariu_mutat, efect: rata_alt_creditor, factor: 1.8 }

cereri:                        # probabilitate per client; o singură cerere per client în modul realist
  adeverinta_sold: { prob: 0.03, produse: [ipotecar, imobiliar, refinantare] }
  refinantare: { prob: 0.015, produse: [nevoi_personale, refinantare], suma: [20000, 80000] }
  simulare_rambursare_anticipata: { prob: 0.03, produse: [ipotecar, imobiliar, nevoi_personale], suma: [5000, 40000] }
  credit_nou: { prob: 0.025, produse: [nevoi_personale, card_credit], suma: [10000, 60000] }
  majorare_limita_card: { prob: 0.015, produse: [card_credit], suma: [3000, 10000] }
  restructurare: { prob: 0.01, produse: [nevoi_personale, ipotecar, imobiliar] }
  actualizare_date: { prob: 0.02, produse: [] }

externe:                       # eșecuri plantate în mock-uri (doar la clienții statistici)
  bc_negativ: 0.012            # întârziere ≥ 90 zile la altă instituție
  crc_garant_restante: 0.006
  cf_litigiu: 0.006
  codebitor_prob: 0.25         # credite garantate cu codebitor (persoană din afara portofoliului)

tranzactii:                    # zgomotul din extrase, redus față de cele 50 ca fișierul să rămână rezonabil la 10.000
  cumparaturi_pe_luna: [1, 3]
  nr_utilitati: 1
  prob_chirie_in: 0.12
  prob_chirie_out: 0.35
  categorii:                   # cât din plățile „altele” rămân pe comerciantul tras sau devin alte categorii (sumă 1.0)
    pastreaza: 0.55
    restaurants: 0.15
    entertainment: 0.08
    transport: 0.08
    services: 0.06
    cash: 0.05
    travel: 0.03

angajatori:
  bazin: 120                   # angajatori distincți pentru clienții statistici
  prob_insolventa: 0.015
  prob_dizolvare: 0.005
  prob_client_al_bancii: 0.6

# Comportamentul ascuns (nu e citit de agent): pragul de câștig net la care clientul pleacă.
# prag = prag_baza × (1 + c_vechime·min(vechime,10)/10 + c_produse·produse_active/4 + c_nivel·nivel + c_activitate·activ) × exp(N(0, sigma))
comportament:
  prag_baza_ron: 6000
  c_vechime: 0.8
  c_produse: 0.9
  c_nivel: 0.7                 # nivel: standard 0 · gold 0.5 · platinum 1
  c_activitate: 0.4
  zgomot_sigma: 0.45
  prob_reactie_informare: 0.35
  prob_accepta_pachet: 0.45
