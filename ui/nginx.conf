server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API-ul: serviciul `api` din docker-compose (fluxul rulează la pornire, deci timeout generos)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    # SPA: orice rută necunoscută → index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
